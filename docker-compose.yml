# GeoAR Engine — full stack: PostgreSQL + Redis + API + Celery worker + web.
#
#   docker compose up --build
#   docker compose exec api python seed_synthetic.py     # optional: demo data
#   open http://localhost:3000
#
# Secrets: set GEOAR_OPERATOR_TOKEN and POSTGRES_PASSWORD in an .env file for
# anything beyond local dev — the defaults below are dev-only and say so.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geoar
      POSTGRES_USER: geoar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoar-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoar -d geoar"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: &backend_env
      GEOAR_DATABASE_URL: postgresql+psycopg://geoar:${POSTGRES_PASSWORD:-geoar-dev-only}@postgres:5432/geoar
      GEOAR_BROKER_URL: redis://redis:6379/0
      GEOAR_RESULT_URL: redis://redis:6379/1
      GEOAR_OPERATOR_TOKEN: ${GEOAR_OPERATOR_TOKEN:-geoar-dev-operator}
      GEOAR_STORAGE_DIR: /srv/storage
    volumes:
      - storage:/srv/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: celery -A app.jobs.celery_app.celery worker --loglevel=info --concurrency=1
    environment: *backend_env
    volumes:
      - storage:/srv/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      GEOAR_API_URL: http://api:8000
      GEOAR_OPERATOR_TOKEN: ${GEOAR_OPERATOR_TOKEN:-geoar-dev-operator}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storage:
